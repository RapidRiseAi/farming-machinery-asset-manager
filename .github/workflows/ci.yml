name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rls-isolation:
    name: RLS isolation tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations + run RLS isolation suite
        run: bash supabase/tests/run.sh

  app-build:
    name: App quality gates + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      # Every string the product shows must exist in BOTH languages. Parity only
      # compares en to af, so a key missing from both passes it — which is how 115 keys
      # once reached a screen reading `reportSchedules.title`.
      - run: pnpm i18n:parity
      # And that every key the code ASKS for exists. Parity compares en to af and passes
      # when a key is missing from BOTH — which is how 115 keys once reached a screen, and
      # how three "What is this?" panels were rendering raw keys to customers until this
      # gate found them. Mutation-tested 3/3 with a passing control.
      - run: pnpm i18n:keys
      # No error code ever reaches a screen as a code. This found four that resolved to
      # nothing, one of them on the product's own sign-up form.
      - run: pnpm errors:check
      # The palette this checks for landed in 7c96e80, so this is now true of the repo
      # rather than of one machine's working tree. It reported 302 violations against
      # the committed tree right up until that commit — which is why it waited.
      - run: pnpm design:lint
      - run: pnpm build
