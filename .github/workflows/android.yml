name: Android

# The Android app's debug build (task B6, docs/ANDROID.md): proves the Capacitor project builds on a
# clean machine and keeps the APK as an artifact for installing on a test phone. Release bundles are
# signed with the founder's upload key on the founder's machine, never here.
on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - "native/**"
      - "capacitor.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  debug-build:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Copies the two local pages, the generated config and the plugin list into the project.
      - run: pnpm exec cap sync android
      # A fixed test key (repository secret ANDROID_TEST_KEYSTORE: an Android debug keystore,
      # base64), so each test build installs over the one before it. Without it Gradle makes a
      # new debug key on every run and the phone refuses the update ("App not installed").
      # Gradle is told the file by FW_TEST_KEYSTORE (android/app/build.gradle): a key left in
      # ~/.android was NOT used on the runner (28 Nov 2026). Test builds only: Google Play builds
      # are signed with the founder's upload key, never here.
      - name: Use the fixed test signing key
        env:
          TEST_KEYSTORE: ${{ secrets.ANDROID_TEST_KEYSTORE }}
        run: |
          if [ -n "$TEST_KEYSTORE" ]; then
            echo "$TEST_KEYSTORE" | base64 -d > "$RUNNER_TEMP/fw-test.keystore"
            echo "FW_TEST_KEYSTORE=$RUNNER_TEMP/fw-test.keystore" >> "$GITHUB_ENV"
            echo "FW_TEST_CERT_SHA256=F3:F1:4F:0F:BC:75:90:DC:80:21:75:41:F2:2D:F6:05:56:72:05:E5:7F:A4:C8:E7:FF:1A:F9:23:AC:1D:FB:C9" >> "$GITHUB_ENV"
          else
            echo "no ANDROID_TEST_KEYSTORE: this build signs with a new debug key and cannot update an installed test app"
          fi
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      # The built app says native/version.json's version, with the build number from the rule in
      # src/lib/native/app-version.ts (versionCodeOf), so Google Play always sees it rise.
      - name: Check the app's version and build number
        run: |
          want_name=$(node -p 'require("./native/version.json").version')
          want_code=$(node -p 'const [a, b, c] = require("./native/version.json").version.split(".").map(Number); a * 10000 + b * 100 + c')
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          badging=$("$aapt2" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -1)
          echo "$badging"
          echo "$badging" | grep -q "versionCode='$want_code'" || { echo "FAILED: build number is not $want_code"; exit 1; }
          echo "$badging" | grep -q "versionName='$want_name'" || { echo "FAILED: version is not $want_name"; exit 1; }
          echo "ok: version $want_name, build $want_code"
      # Signed with the fixed test key, proven from the APK itself (its certificate's SHA-256),
      # not from a step that merely wrote the key somewhere.
      - name: Check the test signing key
        run: |
          if [ -n "${FW_TEST_CERT_SHA256:-}" ]; then
            node scripts/apk_cert_sha256.mjs android/app/build/outputs/apk/debug/app-debug.apk "$FW_TEST_CERT_SHA256"
            echo "ok: signed with the fixed test key"
          else
            echo "signed with: $(node scripts/apk_cert_sha256.mjs android/app/build/outputs/apk/debug/app-debug.apk) (no fixed test key)"
          fi
      # Kept even when a check below fails, so the build can be inspected.
      - uses: actions/upload-artifact@v4
        with:
          name: fleetwise-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Check what the merged manifest declares
        working-directory: android
        run: |
          merged=$(find app/build/intermediates -name AndroidManifest.xml -path "*merged_manifest*debug*" | head -1)
          echo "merged manifest: $merged"
          echo "--- permissions, features and services as merged ---"
          grep -n -E 'uses-permission|uses-feature|<service|foregroundServiceType|exported=|allowBackup' "$merged" || true
          # The geolocation service element on one line, whatever the merger's line breaks.
          service=$(awk '/<service/{s=""; on=1} on{s=s $0} on && />/{if (s ~ /BackgroundGeolocationService/) print s; on=0}' "$merged")
          echo "--- geolocation service ---"
          echo "$service"
          fail=0
          if grep -q 'android.permission.FOREGROUND_SERVICE_LOCATION' "$merged"; then echo "ok: foreground service location permission"; else echo "FAILED: foreground service location permission"; fail=1; fi
          if grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' "$merged"; then echo "FAILED: background location permission present"; fail=1; else echo "ok: no background location permission"; fi
          if echo "$service" | grep -q 'foregroundServiceType="location"'; then echo "ok: location foreground service type"; else echo "FAILED: location foreground service type"; fail=1; fi
          if echo "$service" | grep -q 'exported="false"'; then echo "ok: geolocation service not exported"; else echo "FAILED: geolocation service exported"; fail=1; fi
          if grep -q 'allowBackup="false"' "$merged"; then echo "ok: backups off"; else echo "FAILED: backups on"; fail=1; fi
          exit $fail
